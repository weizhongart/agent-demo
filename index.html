<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>电商管理后台 - 用户管理</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <h1>电商管理后台</h1>
        <nav>
          <a class="active" href="#">用户管理</a>
        </nav>
      </aside>
      <main class="content">
        <header class="page-header">
          <h2>用户管理</h2>
          <button id="createUserButton" class="primary">新建用户</button>
        </header>

        <section class="summary" id="summaryCards"></section>

        <section class="card">
          <div class="toolbar">
            <input id="searchInput" type="text" placeholder="搜索用户名 / 邮箱 / 手机号" />
            <select id="statusFilter">
              <option value="all">全部状态</option>
              <option value="active">正常</option>
              <option value="disabled">禁用</option>
            </select>
            <select id="roleFilter">
              <option value="all">全部角色</option>
              <option value="普通用户">普通用户</option>
              <option value="会员">会员</option>
              <option value="VIP">VIP</option>
              <option value="企业客户">企业客户</option>
            </select>
            <select id="lockFilter" title="按账户锁定状态筛选">
              <option value="all">全部锁定状态</option>
              <option value="unlocked">未锁定</option>
              <option value="locked">已锁定</option>
            </select>
            <button id="resetFilters">重置筛选</button>
          </div>

          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>用户名</th>
                  <th>邮箱</th>
                  <th>手机号</th>
                  <th>角色</th>
                  <th>状态</th>
                  <th>注册时间</th>
                  <th>最后登录</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="userTableBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <dialog id="userDialog">
      <form id="userForm" method="dialog">
        <h3 id="dialogTitle">新建用户</h3>
        <input type="hidden" id="editingUserId" />

        <label>用户名<input id="usernameInput" required minlength="2" maxlength="20" /></label>
        <label>邮箱<input id="emailInput" required type="email" /></label>
        <label>手机号<input id="phoneInput" required pattern="^1[3-9]\\d{9}$" /></label>
        <label>
          角色
          <select id="roleInput" required>
            <option value="普通用户">普通用户</option>
            <option value="会员">会员</option>
            <option value="VIP">VIP</option>
            <option value="企业客户">企业客户</option>
          </select>
        </label>
        <label>
          状态
          <select id="statusInput" required>
            <option value="active">正常</option>
            <option value="disabled">禁用</option>
          </select>
        </label>
        <label class="checkbox-row">
          <input id="lockedInput" type="checkbox" />
          账户已锁定（禁止登录，与「禁用」独立）
        </label>

        <menu>
          <button type="button" id="cancelDialogButton">取消</button>
          <button class="primary" type="submit">保存</button>
        </menu>
      </form>
    </dialog>

    <script src="./script.js"></script>
  </body>
</html>
